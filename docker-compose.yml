#es el archivo que describe cómo levantar la aplicación completa con todos sus servicios y dependencias en contenedores Docker
version: '3.8'

services:
  api:
    build: .
    container_name: flask_api_aprendiz
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DB=sena_db
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://root:root@mysql_db:3306/sena_db
      - MONGO_URI=mongodb://mongo_db:27017/sena_mongodb
    depends_on:
      - mysql_db
      - mongo_db
    volumes:
      - .:/app

  mysql_db:
    image: mysql:8.0
    container_name: mysql_sena
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sena_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongo_db:
    image: mongo:latest
    container_name: mongo_sena
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: